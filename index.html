<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0b13">
  <meta name="description" content="Installer download">
  <title>Download</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="title">
      <div class="panel-top"><span class="signal"></span><span>PACKAGE READY</span><span class="release">LATEST</span></div>
      <div class="glyph" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 id="title">Get the installer</h1>
      <p class="subhead">Latest build is prepared and ready to download.</p>
      <a class="download" id="download-link" href="https://github.com/TeamBisonSafeguard/installer-download/releases/latest/download/Installer.zip" download>
        <span class="arrow" aria-hidden="true">↓</span><span>Download</span><span class="key" aria-hidden="true">ZIP</span>
      </a>
      <div class="details">
        <div><span>FORMAT</span><b>Installer.zip</b></div>
        <div><span>SIZE</span><b>169.14 MB</b></div>
      </div>
      <p class="footnote">Download · extract · run</p>
    </section>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('download-link').click();
    });
  </script>
</body>
</html>
